name: AutoStudio - free audio model safeguards offline once
on:
  push:
    branches:
      - feat/offline-audio-ai-qa-20261119
permissions:
  contents: read
jobs:
  final-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Check syntax of all new local models and existing narrator
        run: |
          python -m py_compile scripts/audio_ai_qa.py scripts/neural_narration.py
          python -m unittest tests.test_audio_ai_qa tests.test_neural_voice_choices -v
