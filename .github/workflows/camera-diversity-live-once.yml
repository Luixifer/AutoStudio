name: AutoStudio - camera collision repair real one-shot
on:
  push:
    branches:
      - test/camera-diversity-real-20261119
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Test regression suite
        run: python -m unittest tests.test_shot_preflight tests.test_visual_distinctness -q
      - name: Restore eight reviewed real scenes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p .autostudio
          gh run download 44541032692 --repo "$REPO" --name AutoStudio-Subject-Diversity-Checkpoint --dir .autostudio
          test -s .autostudio/shot-checkpoint.json
      - name: Real text-only Cloudflare shot preflight
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python -m scripts.shot_preflight \
            --story requests/51cc3cfcdfef933be83eb3d4bb739472/storyboard.json \
            --out /tmp/camera-plan.json \
            --checkpoint .autostudio/shot-checkpoint.json
      - name: Save signed approved scenes even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AutoStudio-Camera-Diversity-Checkpoint
          path: .autostudio/shot-checkpoint.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Archive finished text plan if validated
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AutoStudio-Camera-Diversity-Complete-Plan
          path: /tmp/camera-plan.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Record factual technical progress only
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS: ${{ job.status }}
        run: |
          python - <<'PY' > /tmp/report.md
          from pathlib import Path
          import json,os
          print("### AutoStudio · prueba real de corrección de ángulos duplicados")
          print("- GitHub:",os.environ["RUN"])
          print("- Resultado:",os.environ["STATUS"])
          print("- FLUX: 0 imágenes; YouTube: sin publicación")
          cp=Path(".autostudio/shot-checkpoint.json")
          if cp.exists():
              d=json.loads(cp.read_text())
              print("- Escenas auténticas aprobadas:",len(d["accepted_shots"]))
          p=Path("/tmp/camera-plan.json")
          if p.exists():
              d=json.loads(p.read_text())
              print("- Plan textual completo:",len(d["shots"]))
              for scene in d["shots"]:
                  print("- Escena",scene["scene"],scene["angle"],scene["subject"],"|",scene["visible_action"])
              print("- Ciencia externa verificada:",d["scientific_facts_verified"])
              print("- Publicación autorizada:",d["ready_to_publish"])
          else:
              print("- El plan no ha superado todas las revisiones")
          PY
          gh issue comment 20 --repo "$REPO" --body-file /tmp/report.md
