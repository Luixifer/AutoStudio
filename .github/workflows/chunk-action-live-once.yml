name: AutoStudio - live scene patch test one-shot
on:
  push:
    branches:
      - test/chunk-action-live-20261119
permissions:
  contents: read
  issues: write
jobs:
  text-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Offline tests
        run: python -m unittest tests.test_shot_preflight tests.test_visual_distinctness -q
      - name: Cloudflare text-only plan
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -m scripts.shot_preflight --story requests/51cc3cfcdfef933be83eb3d4bb739472/storyboard.json --out /tmp/plan.json
      - name: Record technical result
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS: ${{ job.status }}
        run: |
          python - <<'PY' > /tmp/report.md
          import os,json
          from pathlib import Path
          print("### AutoStudio · comprobación real de planificación por lotes con reparación puntual")
          print("- Run:",os.environ["URL"])
          print("- Resultado:",os.environ["STATUS"])
          print("- Imágenes FLUX: 0; publicación YouTube: desactivada")
          p=Path("/tmp/plan.json")
          if p.exists():
              d=json.loads(p.read_text())
              print("- Planos validados:",len(d["shots"]))
              print("- Científicamente verificados externamente:",d["scientific_facts_verified"])
              for s in d["shots"]:
                  print("- Escena",s["scene"],s["scale"],s["angle"],s["role"],"|",s["visible_action"])
          else:
              print("- Sin plan aprobado; ver el motivo exacto en Actions")
          PY
          gh issue comment 20 --repo "$REPO" --body-file /tmp/report.md
