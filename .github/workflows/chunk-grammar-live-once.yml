name: AutoStudio - unique grammar chunk live once
on:
  push:
    branches:
      - test/chunk-grammar-live-20261119
permissions:
  contents: read
  issues: write
jobs:
  text-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Offline tests
        run: python -m unittest tests.test_shot_preflight tests.test_visual_distinctness -q
      - name: Live Cloudflare text-only planning
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -m scripts.shot_preflight --story requests/51cc3cfcdfef933be83eb3d4bb739472/storyboard.json --out /tmp/plan.json
      - name: Log result in issue 20
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS: ${{ job.status }}
        run: |
          python - <<'PY' > /tmp/report.md
          import os,json
          from pathlib import Path
          print("### AutoStudio · ensayo real planificador por bloques con gramática única")
          print("- Run:",os.environ["URL"])
          print("- Status:",os.environ["STATUS"])
          print("- FLUX: 0 imágenes, publicación: desactivada")
          p=Path("/tmp/plan.json")
          if p.exists():
              d=json.loads(p.read_text())
              print("- Planos validados:",len(d["shots"]))
              print("- Control científico externo:",d["scientific_facts_verified"])
              for x in d["shots"]:
                  print("- Escena",x["scene"],x["scale"],x["angle"],x["role"],"|",x["visible_action"])
          else:
              print("- Plan rechazado: revisión de logs requerida")
          PY
          gh issue comment 20 --repo "$REPO" --body-file /tmp/report.md
