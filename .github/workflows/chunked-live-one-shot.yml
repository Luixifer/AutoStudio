name: AutoStudio - live chunked preflight one-shot
on:
  push:
    branches:
      - test/chunked-live-20261119
permissions:
  contents: read
  issues: write
jobs:
  text-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Validar codigo y regresiones
        run: python -m unittest tests.test_shot_preflight tests.test_visual_distinctness -q
      - name: Generar bloques con Cloudflare real sin FLUX
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -m scripts.shot_preflight --story requests/51cc3cfcdfef933be83eb3d4bb739472/storyboard.json --out /tmp/chunked-plan.json
      - name: Publicar informe tecnico, nunca video
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS: ${{ job.status }}
        run: |
          python - <<'PY' > /tmp/report.md
          import json,os
          from pathlib import Path
          print("### AutoStudio · primera prueba real del planificador por bloques")
          print("- Ejecución:",os.environ["RUN"])
          print("- Estado:",os.environ["STATUS"])
          print("- FLUX: 0; publicación en YouTube: desactivada")
          p=Path("/tmp/chunked-plan.json")
          if p.exists():
              d=json.loads(p.read_text())
              print("- Planos verificados:",len(d["shots"]))
              print("- Comprobación científica externa:",d["scientific_facts_verified"])
              for shot in d["shots"]:
                  print("- Escena",shot["scene"],shot["scale"],shot["angle"],shot["role"],"|",shot["visible_action"])
          else:
              print("- Bloque rechazado: ninguna imagen autorizada, consultar error del job")
          PY
          gh issue comment 20 --repo "$REPO" --body-file /tmp/report.md
