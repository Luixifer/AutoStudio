name: AutoStudio · Cinematic Polish 0.9
on:
  push:
    branches: [feature/cinematic-polish-09]
    paths:
      - 'scripts/personal_cinematic.py'
      - 'scripts/personal_editor.py'
      - 'tests/test_cinematic_polish.py'
      - '.github/workflows/cinematic-polish-09.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: autostudio-cinematic09-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focal-composition-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Dependencies without paid APIs
        run: |
          command -v ffmpeg
          ffmpeg -version | head -1
          if ! python -c 'from PIL import Image; print(Image.__version__)'; then
            python -m pip install --disable-pip-version-check --retries 1 --timeout 15 Pillow==11.3.0
          fi
      - name: Cinematic composition and colour tests
        run: python -m unittest discover -s tests -p 'test_cinematic_polish.py' -v
      - name: Full video contract tests
        run: python -m unittest discover -s tests -p 'test_personal_studio.py' -v
      - name: Real cinematic short with audio/subtitles and decoded frame QA
        run: python -m unittest discover -s tests -p 'test_personal_video_real.py' -v
