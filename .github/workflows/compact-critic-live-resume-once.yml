name: AutoStudio - compact critic real five-shot resume once
on:
  push:
    branches:
      - test/compact-critic-live-resume-20261119
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  text:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Test code offline
        run: python -m unittest tests.test_shot_preflight tests.test_visual_distinctness -q
      - name: Restore authentic five shot checkpoint from previous run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p .autostudio
          gh run download 44522318811 --repo "$REPO" --name AutoStudio-Real-Resumed-Checkpoint --dir .autostudio
          test -s .autostudio/shot-checkpoint.json
          echo "Restored five-scene authenticated checkpoint"
      - name: Resume text-only documentary planning with Cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python -m scripts.shot_preflight \
            --story requests/51cc3cfcdfef933be83eb3d4bb739472/storyboard.json \
            --out /tmp/preflight-plan.json \
            --checkpoint .autostudio/shot-checkpoint.json
      - name: Preserve any new approved scenes
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AutoStudio-Compact-Critic-Checkpoint
          path: .autostudio/shot-checkpoint.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Persist preproduction result without publishing
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS: ${{ job.status }}
        run: |
          python - <<'PY' > /tmp/report.md
          import json,os
          from pathlib import Path
          print("### AutoStudio: primer ensayo real de revisor compacto")
          print("- Ejecución:",os.environ["RUN"])
          print("- Resultado:",os.environ["STATUS"])
          print("- Imágenes nuevas FLUX: 0; publicación YouTube desactivada")
          cp=Path(".autostudio/shot-checkpoint.json")
          if cp.exists():
              data=json.loads(cp.read_text())
              print("- Escenas preservadas:",len(data["accepted_shots"]))
          else:
              print("- Checkpoint no disponible")
          out=Path("/tmp/preflight-plan.json")
          if out.exists():
              data=json.loads(out.read_text())
              print("- Plan textual completo:",len(data["shots"]))
              for s in data["shots"]:
                  print("- Escena",s["scene"],s["scale"],s["angle"],s["role"],"|",s["visible_action"])
          else:
              print("- Plan incompleto o rechazado; ver logs")
          PY
          gh issue comment 20 --repo "$REPO" --body-file /tmp/report.md
