name: AutoStudio - one-shot live critic text only
on:
  push:
    branches:
      - test/critic-live-text-20261119
permissions:
  contents: read
  issues: write
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Tests offline
        run: python -m unittest tests.test_shot_preflight tests.test_visual_distinctness -q
      - name: Live text-only shot preflight
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -m scripts.shot_preflight --story requests/51cc3cfcdfef933be83eb3d4bb739472/storyboard.json --out /tmp/live-plan.json
      - name: Report without publishing or images
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS: ${{ job.status }}
        run: |
          python - <<'PY' > /tmp/live-report.md
          import os,json
          from pathlib import Path
          print("### AutoStudio · prueba real del crítico corregido (solo texto)")
          print("- Run:",os.environ["RUN"])
          print("- Resultado:",os.environ["STATUS"])
          p=Path("/tmp/live-plan.json")
          print("- FLUX: 0 imágenes; YouTube: publicación desactivada")
          if p.exists():
              d=json.loads(p.read_text())
              print("- Escenas validadas:",len(d["shots"]))
              for s in d["shots"]:
                  print("- Escena",s["scene"],":",s["visible_action"])
          else:
              print("- Plan no validado; revisar logs antes de autorizar imágenes")
          PY
          gh issue comment 20 --repo "$REPO" --body-file /tmp/live-report.md
