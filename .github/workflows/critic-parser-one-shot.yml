name: AutoStudio - critic parser regression (one-shot)
on:
  push:
    branches:
      - fix/critic-reply-parsing-20261119
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_shot_preflight tests.test_visual_distinctness -v
