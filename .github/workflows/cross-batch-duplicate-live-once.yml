name: AutoStudio - real cross batch repair verification once
on:
  push:
    branches:
      - test/cross-batch-duplicate-live-20261119
permissions:
  contents: read
  issues: write
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Offline regression suite
        run: python -m unittest tests.test_shot_preflight tests.test_visual_distinctness -q
      - name: Live Cloudflare text-only preflight
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -m scripts.shot_preflight --story requests/51cc3cfcdfef933be83eb3d4bb739472/storyboard.json --out /tmp/shot-plan.json
      - name: Document result with no publishing
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS: ${{ job.status }}
        run: |
          python - <<'PY' > /tmp/report.md
          from pathlib import Path
          import json,os
          print("### AutoStudio · ensayo real de reparación entre bloques")
          print("- Ejecución:",os.environ["RUN"])
          print("- Resultado:",os.environ["STATUS"])
          print("- FLUX: 0 imágenes; YouTube: publicación desactivada")
          p=Path("/tmp/shot-plan.json")
          if p.exists():
              d=json.loads(p.read_text())
              print("- Escenas validadas:",len(d["shots"]))
              print("- Verificación científica externa:",d["scientific_facts_verified"])
              for s in d["shots"]:
                  print("- Escena",s["scene"],s["scale"],s["angle"],s["role"],"|",s["visible_action"])
          else:
              print("- Plan no aprobado. Ver motivo del rechazo en registros Actions")
          PY
          gh issue comment 20 --repo "$REPO" --body-file /tmp/report.md
