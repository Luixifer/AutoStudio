name: Director 2 · regresiones del motor
on:
  push:
    branches: ['codex/director-2-scene-integrity']
    paths: ['scripts/director/**', 'tests/test_director*', '.github/workflows/director-core.yml']
permissions:
  contents: read
jobs:
  regression:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install -r requirements-director.txt
          python -m unittest discover -s tests -v
