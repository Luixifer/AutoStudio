name: AutoStudio - strict editorial and structured repair live one-shot
on:
  push:
    branches:
      - test/strict-editorial-gemma-recovery-20261119
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  strict-text:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Run offline tests
        run: python -m unittest tests.test_shot_preflight tests.test_visual_distinctness -q
      - name: Restore the two genuinely accepted editorial scenes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p .autostudio
          gh run download 44538757613 --repo "$REPO" --name AutoStudio-Strict-Editorial-Checkpoint --dir .autostudio
          test -s .autostudio/shot-checkpoint.json
      - name: Continue real text-only plan with bounded Gemma final corrections
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python -m scripts.shot_preflight \
            --story requests/51cc3cfcdfef933be83eb3d4bb739472/storyboard.json \
            --out /tmp/editorial-plan.json \
            --checkpoint .autostudio/shot-checkpoint.json
      - name: Save signed accepted scenes regardless of final status
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AutoStudio-Editorial-Gemma-Checkpoint
          path: .autostudio/shot-checkpoint.json
          retention-days: 21
          if-no-files-found: ignore
      - name: Save complete plan if created
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AutoStudio-Editorial-Gemma-Full-Plan
          path: /tmp/editorial-plan.json
          retention-days: 21
          if-no-files-found: ignore
      - name: Log editorial status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS: ${{ job.status }}
        run: |
          python - <<'PY' > /tmp/report.md
          import json,os
          from pathlib import Path
          print("### AutoStudio · nuevo ensayo de preproducción con revisión editorial y Gemma")
          print("- Ejecución:",os.environ["RUN_URL"])
          print("- Estado:",os.environ["STATUS"])
          print("- FLUX imágenes nuevas: 0; publicación automática: desactivada")
          cp=Path(".autostudio/shot-checkpoint.json")
          if cp.is_file():
              d=json.loads(cp.read_text())
              print("- Escenas aprobadas conservadas:",len(d["accepted_shots"]))
          p=Path("/tmp/editorial-plan.json")
          if p.exists():
              d=json.loads(p.read_text())
              print("- Plan editorial textual completo:",len(d["shots"]))
              for shot in d["shots"]:
                  print("- Escena",shot["scene"],shot["subject"],"|",shot["visible_action"])
              print("- Científicamente verificado externamente:",d["scientific_facts_verified"])
              print("- Publicación autorizada:",d["ready_to_publish"])
          else:
              print("- No se autoriza generar imágenes: preproducción incompleta")
          PY
          gh issue comment 20 --repo "$REPO" --body-file /tmp/report.md
