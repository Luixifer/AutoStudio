name: AutoStudio - reject old green but irrelevant plan once
on:
  push:
    branches:
      - test/strict-editorial-checkpoint-20261119
permissions:
  contents: read
  actions: read
jobs:
  editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Restore actual ten-scene signed approved checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p .autostudio
          gh run download 44537027675 --repo "$REPO" --name AutoStudio-Gemma-Structured-Checkpoint --dir .autostudio
          test -s .autostudio/shot-checkpoint.json
      - name: Verify old false-positive plan is rejected BEFORE FLUX
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from scripts import shot_preflight as s
          story=json.loads(Path("requests/51cc3cfcdfef933be83eb3d4bb739472/storyboard.json").read_text())
          cp=Path(".autostudio/shot-checkpoint.json")
          signed=json.loads(cp.read_text())
          assert len(signed["accepted_shots"])==10
          assert "scientist" in signed["accepted_shots"][0]["subject"].lower()
          accepted,size=s._read_checkpoint(cp,story,os.environ["CLOUDFLARE_API_TOKEN"])
          assert accepted == [], "Unsupported talking-head scene must invalidate entire prefix"
          assert size in (1,2)
          assert not cp.exists(), "Invalid signed prefix must be physically discarded"
          print("PASS: old 10/10 technically green plan rejected under editorial policy")
          print("Zero model requests, zero FLUX images and zero YouTube publishing")
          PY
