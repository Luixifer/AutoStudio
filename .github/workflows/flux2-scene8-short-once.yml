name: AutoStudio - single compact orbital image FLUX2 one-shot
on:
  push:
    branches:
      - test/flux2-scene8-short-20261119
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  scene8:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Single image budget and provider checks
        run: python -m unittest tests.test_flux2_klein tests.test_cinematic_pilot -q
      - name: Restore authenticated shot plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p .autostudio
          gh run download 44544284803 --repo "$REPO" --name AutoStudio-Full-Schema-Checkpoint --dir .autostudio
          test -s .autostudio/shot-checkpoint.json
      - name: Generate one alternative compact cinematic orbit draft
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          from scripts.shot_preflight import _read_checkpoint
          from scripts.flux2_klein import generate_klein,MODEL
          from scripts.image_generation import image_dimensions
          from scripts.vision_gemma import evaluate_gemma
          story=json.loads(Path("requests/51cc3cfcdfef933be83eb3d4bb739472/storyboard.json").read_text())
          scenes,_=_read_checkpoint(".autostudio/shot-checkpoint.json",story,os.environ["CLOUDFLARE_API_TOKEN"])
          shot=scenes[7]
          assert len(scenes)==10 and shot["scene"]==8
          # Automatic compact descriptor derived from an already approved
          # shot; no retouching of the text narration or outside science.
          prompt=(
              "Original premium realistic astronomy CGI cinema still, "
              "16:9 widescreen composition: a gaseous giant exoplanet in "
              "deep space extremely close to its vastly larger bright "
              "parent star. Show the star and planet clearly separated in "
              "frame with intense plausible illumination and a dense "
              "atmosphere. The spatial relationship must convey a very "
              "tight orbit. No ground, lava, orbit line, clocks, infographic, "
              "labels, text or watermarks. Subject: "+shot["subject"]+"."
          )
          out=Path("/tmp/orbit-scene8")
          out.mkdir(parents=True,exist_ok=True)
          record={"scene":8,"provider":MODEL,"prompt":prompt,
                  "image_generated":False,"vision":{"decision":"NOT_EVALUATED"},
                  "human_visual_approved":False,"ready_to_publish":False,
                  "image_requests":1}
          try:
              raw=generate_klein(prompt,os.environ["CLOUDFLARE_ACCOUNT_ID"],
                                  os.environ["CLOUDFLARE_API_TOKEN"])
              w,h,ext=image_dimensions(raw)
              filename="kelt9b_orbit_scene_08"+ext
              (out/filename).write_bytes(raw)
              record.update({"image_generated":True,"file":filename,
                             "dimensions":[w,h],
                             "sha256":hashlib.sha256(raw).hexdigest()})
              try:
                  record["vision"]=evaluate_gemma(
                      raw,story["scenes"][7]["narration"],prompt,
                      os.environ["CLOUDFLARE_ACCOUNT_ID"],
                      os.environ["CLOUDFLARE_API_TOKEN"])
              except Exception as exc:
                  record["vision"]={"decision":"UNSURE",
                                    "evidence":"QA error "+type(exc).__name__}
          finally:
              (out/"orbit-qa.json").write_text(
                  json.dumps(record,ensure_ascii=False,indent=2)+"\n")
          print("SCENE8_GENERATED",record["image_generated"],
                "QA",record["vision"]["decision"])
          PY
      - name: Preserve real candidate and evaluation
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AutoStudio-KELT9b-Scene8-FLUX2-ShortPrompt
          path: |
            /tmp/orbit-scene8/*.jpg
            /tmp/orbit-scene8/*.png
            /tmp/orbit-scene8/orbit-qa.json
          retention-days: 14
          if-no-files-found: warn
