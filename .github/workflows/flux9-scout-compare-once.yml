name: AutoStudio - compare FLUX2 Klein 4B vs 9B with Llama4 + Gemma once
on:
  push:
    branches:
      - feat/second-vision-and-flux9-comparison-20261119
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Offline regression suite and syntax verification
        run: |
          python -m unittest tests.test_vision_scout_flux9 tests.test_compare_visual_models tests.test_flux2_klein tests.test_vision_gemma -q
          python -m py_compile scripts/vision_scout.py scripts/flux2_klein_9b.py scripts/compare_visual_models.py
      - name: Download archived real 4B orbit scene with original prompt and hash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p .reference
          gh run download 44548159087 --repo "$REPO" --name AutoStudio-KELT9b-Scene8-FLUX2-ShortPrompt --dir .reference
          test -s .reference/orbit-qa.json
          test -s .reference/kelt9b_orbit_scene_08.jpg
      - name: One real FLUX.2 Klein 9B image and independent two-model vision inspection
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python -m scripts.compare_visual_models \
            --reference .reference \
            --out /tmp/ab-kelt9b \
            --story requests/51cc3cfcdfef933be83eb3d4bb739472/storyboard.json \
            --live --max-new-images 1
      - name: Create visually comparable side-by-side contact sheet
        if: ${{ always() }}
        run: |
          python -m pip -q install Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          p=Path('/tmp/ab-kelt9b')
          images=[v for v in (p/'comparison_4b.jpg',p/'comparison_9b.jpg',p/'comparison_9b.png') if v.is_file()]
          if not images: raise SystemExit(0)
          w,h=800,510
          target=Image.new('RGB',(w*len(images),h),'#10131b')
          draw=ImageDraw.Draw(target)
          for i,path in enumerate(images):
              im=Image.open(path).convert('RGB')
              im.thumbnail((w-24,h-56),Image.Resampling.LANCZOS)
              target.paste(im,(i*w+(w-im.width)//2,(h-52-im.height)//2))
              draw.text((i*w+20,h-33),path.stem,fill='white')
          target.save(p/'comparison-contact-sheet.jpg',quality=88,optimize=True)
          print('A_B_CONTACT_SHEET',len(images))
          PY
      - name: Always preserve actual images and independent evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AutoStudio-FLUX9-Scout-vs-Gemma-Real-Comparison
          path: |
            /tmp/ab-kelt9b/*.jpg
            /tmp/ab-kelt9b/*.png
            /tmp/ab-kelt9b/comparison-results.json
          retention-days: 14
          if-no-files-found: warn
      - name: Record verified status without media publication
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS: ${{ job.status }}
        run: |
          python - <<'PY' > /tmp/report.md
          from pathlib import Path
          import os,json
          print('### AutoStudio: comparativa 4B/9B y evaluadores Gemma/Scout')
          print('- Ejecución:',os.environ['RUN_URL'])
          print('- Estado:',os.environ['STATUS'])
          print('- Máximo imágenes nuevas: 1; publicación: DESACTIVADA')
          f=Path('/tmp/ab-kelt9b/comparison-results.json')
          if f.is_file():
              d=json.loads(f.read_text())
              print('- Imágenes nuevas solicitadas:',d['new_image_requests_attempted'])
              for x in d['results']:
                  print('- Modelo:',x['label'],'| imagen:',x['file'],
                        '| Gemma:',x['gemma']['decision'],
                        '| Scout:',x['scout']['decision'],
                        '| gate:',x['inspection']['automated_result'])
                  print('  - Gemma:',str(x['gemma'].get('evidence',''))[:320])
                  print('  - Scout:',str(x['scout'].get('evidence',''))[:320])
              if d.get('error'): print('- Error:',d['error'])
              print('- Aprobación humana:',d['human_visual_approved'])
              print('- Ready to publish:',d['ready_to_publish'])
          else:
              print('- Sin resultados. Fallo de configuración o pruebas.')
          PY
          gh issue comment 20 --repo "$REPO" --body-file /tmp/report.md
