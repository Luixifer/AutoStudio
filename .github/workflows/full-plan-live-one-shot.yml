name: AutoStudio - live full plan semantic repair one shot
on:
  push:
    branches:
      - test/full-plan-live-20261119
permissions:
  contents: read
  issues: write
jobs:
  text-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Offline regression suite
        run: python -m unittest tests.test_shot_preflight tests.test_visual_distinctness -q
      - name: Real Cloudflare planner and critic without FLUX
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -m scripts.shot_preflight --story requests/51cc3cfcdfef933be83eb3d4bb739472/storyboard.json --out /tmp/full-plan.json
      - name: Report to issue
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS: ${{ job.status }}
        run: |
          python - <<'PY' > /tmp/shot-report.md
          from pathlib import Path
          import os,json
          print("### AutoStudio: reparación semántica completa, Cloudflare real, cero FLUX")
          print("- Run:",os.environ["RUN"])
          print("- Estado:",os.environ["STATUS"])
          print("- Imágenes FLUX: 0; publicación: desactivada")
          p=Path("/tmp/full-plan.json")
          if p.exists():
              d=json.loads(p.read_text())
              print("- Escenas:",len(d["shots"]))
              for shot in d["shots"]:
                  print("- Escena",shot["scene"],":",shot["visible_action"])
          else:
              print("- Plan no autorizado; ver el error en el registro de Actions")
          PY
          gh issue comment 20 --repo "$REPO" --body-file /tmp/shot-report.md
