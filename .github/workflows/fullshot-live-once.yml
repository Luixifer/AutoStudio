name: AutoStudio - live fullshot patch test once
on:
  push:
    branches:
      - test/fullshot-repair-live-20261119
permissions:
  contents: read
  issues: write
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Offline tests
        run: python -m unittest tests.test_shot_preflight tests.test_visual_distinctness -q
      - name: Real text-only planning
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -m scripts.shot_preflight --story requests/51cc3cfcdfef933be83eb3d4bb739472/storyboard.json --out /tmp/plan.json
      - name: Write report on issue 20
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS: ${{ job.status }}
        run: |
          python - <<'PY' > /tmp/report.md
          import os,json
          from pathlib import Path
          print("### AutoStudio · prueba real del JSON y reparación flexible con metadatos inmóviles")
          print("- Ejecución:",os.environ["URL"])
          print("- Resultado:",os.environ["STATUS"])
          print("- FLUX: 0 imágenes; publicación: desactivada")
          p=Path("/tmp/plan.json")
          if p.exists():
              d=json.loads(p.read_text())
              print("- Escenas prevalidadas:",len(d["shots"]))
              for s in d["shots"]:
                  print("- Escena",s["scene"],s["scale"],s["angle"],s["role"],"|",s["visible_action"])
              print("- Ciencia independiente verificada:",d["scientific_facts_verified"])
          else:
              print("- Ningún plan completo autorizado, revisar logs")
          PY
          gh issue comment 20 --repo "$REPO" --body-file /tmp/report.md
