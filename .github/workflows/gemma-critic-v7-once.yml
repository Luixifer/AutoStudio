name: AutoStudio - live independent Gemma reviewer once
on:
  push:
    branches:
      - test/live-gemma-critic-v7-20261119
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  text:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Tests sin Cloudflare ni FLUX
        run: python -m unittest tests.test_shot_preflight tests.test_visual_distinctness -q
      - name: Restore two authentic signed and scientifically safe shots
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p .autostudio
          gh run download 44528144967 --repo "$REPO" --name AutoStudio-Positive-Gas-V6-Checkpoint --dir .autostudio
          test -s .autostudio/shot-checkpoint.json
      - name: Cloudflare real preflight - Gemma critic, no images
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python -m scripts.shot_preflight \
            --story requests/51cc3cfcdfef933be83eb3d4bb739472/storyboard.json \
            --out /tmp/approved-plan.json \
            --checkpoint .autostudio/shot-checkpoint.json
      - name: Preserve signed new scenes even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AutoStudio-Gemma-Critic-V7-Checkpoint
          path: .autostudio/shot-checkpoint.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Report scientific verification status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS: ${{ job.status }}
        run: |
          python - <<'PY' > /tmp/report.md
          import json,os
          from pathlib import Path
          print("### AutoStudio · primera prueba real del revisor científico Gemma 4")
          print("- Run:",os.environ["RUN"])
          print("- Estado:",os.environ["STATUS"])
          print("- Imágenes nuevas: 0; publicación automática: desactivada")
          cp=Path(".autostudio/shot-checkpoint.json")
          if cp.exists():
              d=json.loads(cp.read_text())
              print("- Escenas firmadas y aprobadas por los controles:",len(d["accepted_shots"]))
          result=Path("/tmp/approved-plan.json")
          if result.exists():
              d=json.loads(result.read_text())
              print("- Guion visual completo aprobado:",len(d["shots"]))
              for s in d["shots"]:
                  print("- Escena",s["scene"],s["scale"],s["angle"],"|",s["visible_action"])
          else:
              print("- Guion visual incompleto. FLUX continúa bloqueado.")
          PY
          gh issue comment 20 --repo "$REPO" --body-file /tmp/report.md
