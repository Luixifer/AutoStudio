name: Image duplicate QA offline
on:
  push:
    branches: [feat/image-perceptual-duplicate-qa]
  pull_request:
    paths:
      - "scripts/image_duplicate_qa.py"
      - "tests/test_image_duplicate_qa.py"
      - ".github/workflows/image-duplicate-qa-offline.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow without cloud AI services
        run: python -m pip install -r requirements.txt
      - name: Verify deterministic synthetic image comparisons
        run: python -m unittest discover -s tests -p test_image_duplicate_qa.py -v
