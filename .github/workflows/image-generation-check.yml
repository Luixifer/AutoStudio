name: AutoStudio · imágenes automáticas (prueba sin coste)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/image_generation.py'
      - 'tests/test_image_generation.py'
      - '.github/workflows/image-generation-check.yml'
permissions:
  contents: read
jobs:
  imagegen-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Probar generación sin llamar a servicios externos
        run: python -m unittest tests.test_image_generation -v
      - name: Validar sintaxis
        run: python -m py_compile scripts/image_generation.py tests/test_image_generation.py
