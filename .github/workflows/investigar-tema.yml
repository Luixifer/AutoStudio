name: AutoStudio 0.4 · Investigar un tema (prueba)
run-name: Investigación · ${{ github.event.inputs.topic }}
on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Tema científico que quieres investigar (solo borrador, no vídeo)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: autostudio-research-trial
  cancel-in-progress: false
jobs:
  research:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      AUTOSTUDIO_TOPIC: ${{ inputs.topic }}
    steps:
      - name: Obtener versión de investigación 0.4 validada
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: f5733af493136531acba015ed00d75809d1b391d
          persist-credentials: false
      - name: Configurar Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Preparar expediente de tema
        run: |
          python -m scripts.research_pipeline "$AUTOSTUDIO_TOPIC" --out-dir "$RUNNER_TEMP/autostudio-research"
      - name: Mostrar resultado en el resumen de GitHub
        env:
          REPORT_DIR: ${{ runner.temp }}/autostudio-research
        run: |
          python - <<'PY'
          import html, json, os
          from pathlib import Path
          reports = list(Path(os.environ["REPORT_DIR"]).glob("*.json"))
          if len(reports) != 1:
              raise SystemExit("Se esperaba exactamente un expediente.")
          pkg = json.loads(reports[0].read_text(encoding="utf-8"))
          dossier = pkg["dossier"]
          research = dossier.get("research", {})
          def safe(value):
              return html.escape(str(value), quote=True)
          output = [
              "## AutoStudio · Resultado de la investigación",
              f"**Tema:** {safe(pkg['topic'])}",
              f"**Estado:** {safe(pkg['state'])}",
              f"**Investigación:** {safe(research.get('status', 'sin consulta'))}",
              f"**Referencias preliminares:** {len(dossier.get('sources', []))}",
              f"**Enlaces NASA (contenido no leído):** {research.get('institutional_leads', 0)}",
              f"**Metadatos académicos Crossref:** {research.get('academic_metadata_leads', 0)}",
              f"**Referencias secundarias Wikipedia:** {research.get('secondary_leads', 0)}",
              "**Afirmaciones científicas verificadas:** 0",
              "",
              "### Fuentes encontradas (sin verificar científicamente)",
          ]
          for source in dossier.get("sources", []):
              output.append(f"- **{safe(source.get('provider', 'Fuente'))}** · {safe(source.get('title', 'Sin título'))}: {safe(source.get('url', 'Sin enlace'))} ({safe(source.get('evidence_level', 'sin verificar'))})")
          output.extend(["", "**NASA:** enlaces seleccionados, sin extraer su contenido. **Crossref:** únicamente metadatos; la presencia de un DOI no verifica las afirmaciones ni garantiza revisión por pares."])
          nasa = pkg.get("nasa_evidence", {})
          output.extend([
              "",
              "### Pasajes localizados en páginas oficiales NASA (en inglés, sin verificar)",
              f"**Pasajes recuperados:** {len(nasa.get('passages', []))}",
              f"**Errores de lectura:** {len(nasa.get('errors', []))}",
          ])
          for item in nasa.get("passages", [])[:5]:
              # Display a brief, explicitly incomplete snippet to avoid
              # presenting truncated page content as a scientific conclusion.
              excerpt = safe(item.get("excerpt_original_en", "")[:145])
              output.append(
                  f"- {safe(item.get('source_title', 'NASA'))}: "
                  f"{safe(item.get('source_url', ''))} — "
                  f"**Inicio del pasaje:** «{excerpt}…»"
              )
          if not nasa.get("passages"):
              output.append("- No se han podido extraer pasajes pertinentes de las páginas consultadas.")
          output.append("Los pasajes son pistas textuales sin comprobación editorial; no son un guion ni están aprobados para narración.")
          extractive = pkg.get("narration_candidates", {})
          output.extend(["", "### Fragmentos de narración extraídos de fuentes (NO es un guion original)"])
          for quote in extractive.get("candidates", []):
              output.append(
                  f"- **Cita textual pendiente de revisión:** «{safe(quote.get('source_excerpt_exact', ''))}» "
                  f"— {safe(quote.get('source_title', 'Wikipedia'))}, "
                  f"{safe(quote.get('source_url', ''))}"
              )
          if not extractive.get("candidates"):
              output.append("- Ningún fragmento responde con suficiente relevancia a esta pregunta. No se inventará narración.")
          output.extend([
              "",
              "Estas frases son extractos literales de Wikipedia, con sus respectivos enlaces,",
              "sujetos a **[CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/deed.es)**",
              "salvo condiciones diferentes indicadas en cada página. No son un guion original,",
              "no se ha verificado su exactitud científica y **no están autorizadas para voz o publicación**.",
          ])
          output.extend(["", "### Escenas previstas (borrador)"])
          for scene in pkg["storyboard"]["scenes"]:
              output.append(f"- {safe(scene['role'])}: {safe(scene['editorial_question'])}")
          output.extend([
              "", "**No se ha generado un vídeo.** Faltan contrastar fuentes, redactar narración y crear las imágenes.",
              "Ninguna API de pago ni publicación en YouTube.",
          ])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as file:
              file.write("\n".join(output) + "\n")
          PY
