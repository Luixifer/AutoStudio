name: AutoStudio - JSON boundary live one shot
on:
  push:
    branches:
      - test/json-boundary-live-20261119
permissions:
  contents: read
  issues: write
jobs:
  text-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Offline tests
        run: python -m unittest tests.test_shot_preflight tests.test_visual_distinctness -q
      - name: Live text-only planner, no image generation
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -m scripts.shot_preflight --story requests/51cc3cfcdfef933be83eb3d4bb739472/storyboard.json --out /tmp/plan.json
      - name: Report to issue 20
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS: ${{ job.status }}
        run: |
          python - <<'PY' > /tmp/report.md
          import json,os
          from pathlib import Path
          print("### AutoStudio · robustez JSON y bloques, prueba real de texto")
          print("- Ejecución:",os.environ["RUN_URL"])
          print("- Resultado:",os.environ["STATUS"])
          print("- Nuevas imágenes FLUX: 0; YouTube: sin publicar")
          p=Path("/tmp/plan.json")
          if p.exists():
              d=json.loads(p.read_text())
              print("- Escenas validadas:",len(d["shots"]))
              for s in d["shots"]:
                  print("- Escena",s["scene"],s["scale"],s["angle"],s["role"],":",s["visible_action"])
              print("- Verificación científica independiente:",d["scientific_facts_verified"])
          else:
              print("- Sin plan autorizado; ver motivo en los logs")
          PY
          gh issue comment 20 --repo "$REPO" --body-file /tmp/report.md
