name: AutoStudio - FLUX2 Klein THREE 16x9 images and visual QA once
on:
  push:
    branches:
      - feat/flux2-klein-cinematic-pilot-20261119
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  compare-three-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Test image generator and safe pilot
        run: |
          python -m unittest tests.test_flux2_klein tests.test_cinematic_pilot tests.test_image_generation -q
          python -m py_compile scripts/flux2_klein.py
      - name: Restore 10-shot authenticated plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p .autostudio
          gh run download 44544284803 --repo "$REPO" --name AutoStudio-Full-Schema-Checkpoint --dir .autostudio
          test -s .autostudio/shot-checkpoint.json
      - name: Call FLUX2 Klein maximum three images, compare with Gemma vision
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from scripts.cinematic_pilot import pilot
          from scripts.flux2_klein import generate_klein, MODEL
          story=json.loads(Path("requests/51cc3cfcdfef933be83eb3d4bb739472/storyboard.json").read_text())
          out=Path("/tmp/autostudio-klein-pilot")
          result=pilot(story,".autostudio/shot-checkpoint.json",out,
                       os.environ["CLOUDFLARE_ACCOUNT_ID"],
                       os.environ["CLOUDFLARE_API_TOKEN"],
                       live=True,generator=generate_klein)
          result["image_provider_model"]=MODEL
          (out/"cinematic-pilot-manifest.json").write_text(
              json.dumps(result,ensure_ascii=False,indent=2)+"\n")
          print("KLEIN_PILOT",sum(s["image_generated"] for s in result["scenes"]),
                "requests",result["completed_image_requests"],
                "ready_to_publish",result["ready_to_publish"])
          PY
      - name: Create full-width film review contact sheet
        if: ${{ always() }}
        run: |
          python -m pip -q install Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          import json
          p=Path('/tmp/autostudio-klein-pilot')
          f=p/'cinematic-pilot-manifest.json'
          if not f.exists():
              print("No images or manifest to visualize")
              raise SystemExit(0)
          result=json.loads(f.read_text())
          images=[(s['scene'],p/s['file']) for s in result['scenes'] if s.get('image_generated')]
          if not images:
              raise SystemExit(0)
          w,h=720,450
          canvas=Image.new('RGB',(w*len(images),h),'#10131b')
          draw=ImageDraw.Draw(canvas)
          for i,(num,path) in enumerate(images):
              image=Image.open(path).convert('RGB')
              image.thumbnail((w-20,h-53),Image.Resampling.LANCZOS)
              x=i*w+(w-image.width)//2
              y=(h-45-image.height)//2
              canvas.paste(image,(x,y))
              draw.text((i*w+15,h-28),f"Scene {num} - Cloudflare FLUX2 klein4b",fill="white")
          canvas.save(p/'contact-sheet.jpg',quality=88,optimize=True)
          print("CONTACT_SHEET",len(images))
          PY
      - name: Archive all generated images, even if models reject them
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AutoStudio-FLUX2-KLEIN-3-Imagenes-16x9
          path: |
            /tmp/autostudio-klein-pilot/*.jpg
            /tmp/autostudio-klein-pilot/*.png
            /tmp/autostudio-klein-pilot/cinematic-pilot-manifest.json
          retention-days: 14
          if-no-files-found: warn
      - name: Record observable visual results, keep publishing OFF
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS: ${{ job.status }}
        run: |
          python - <<'PY' > /tmp/review.md
          from pathlib import Path
          import json,os
          print("### AutoStudio: FLUX2 Klein 4B 1536x864 experimental comparison")
          print("- Run:",os.environ["RUN"])
          print("- Result:",os.environ["STATUS"])
          print("- Auto-publishing: disabled")
          f=Path("/tmp/autostudio-klein-pilot/cinematic-pilot-manifest.json")
          if f.exists():
              d=json.loads(f.read_text())
              print("- Image requests:",d["completed_image_requests"],"/ 3")
              for x in d["scenes"]:
                  print("- Scene",x["scene"],"image:",x.get("file","missing"),
                        "dimensions:",x.get("dimensions"),
                        "vision:",x["vision"]["decision"],
                        "evidence:",str(x["vision"].get("evidence",""))[:350])
              print("- Ready to publish:",d["ready_to_publish"])
          else:
              print("- No manifest generated")
          PY
          gh issue comment 20 --repo "$REPO" --body-file /tmp/review.md
