name: AutoStudio - three REAL KELT-9b images / Gemma QA one-shot
on:
  push:
    branches:
      - feat/kelt-cinematic-3shot-pilot-20261119
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  three-shot-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Offline safeguards and source syntax
        run: |
          python -m unittest tests.test_cinematic_pilot tests.test_image_generation -v
          python -m py_compile scripts/cinematic_pilot.py
      - name: Restore authentic complete 10-scene signed plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p .autostudio
          gh run download 44544284803 --repo "$REPO" --name AutoStudio-Full-Schema-Checkpoint --dir .autostudio
          test -s .autostudio/shot-checkpoint.json
      - name: Generate MAX THREE real FLUX drafts and check via Gemma multimodal
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python -m scripts.cinematic_pilot \
            --story requests/51cc3cfcdfef933be83eb3d4bb739472/storyboard.json \
            --checkpoint .autostudio/shot-checkpoint.json \
            --out /tmp/kelt-cinematic-pilot \
            --live --max-requests 3
      - name: Create review contact sheet for images that exist
        if: ${{ always() }}
        run: |
          python -m pip -q install Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFont
          import json
          p=Path('/tmp/kelt-cinematic-pilot')
          if not (p/'cinematic-pilot-manifest.json').exists():
              print('No manifest to visualize')
              raise SystemExit(0)
          manifest=json.loads((p/'cinematic-pilot-manifest.json').read_text())
          files=[p/x['file'] for x in manifest['scenes'] if x.get('image_generated')]
          if not files:
              print('No generated images')
              raise SystemExit(0)
          width,height=620,440
          sheet=Image.new('RGB',(width*len(files),height),'#131720')
          draw=ImageDraw.Draw(sheet)
          for i,f in enumerate(files):
              im=Image.open(f).convert('RGB')
              im.thumbnail((width-24,height-50),Image.Resampling.LANCZOS)
              x=i*width+(width-im.width)//2
              y=(height-50-im.height)//2+10
              sheet.paste(im,(x,y))
              draw.text((i*width+24,height-32),f.stem,fill='white')
          sheet.save(p/'contact-sheet.jpg',quality=88,optimize=True)
          print('CONTACT_SHEET_CREATED',len(files))
          PY
      - name: Archive all generated photos and QA reports (always)
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AutoStudio-KELT9b-Primeras-3-Imagenes
          path: |
            /tmp/kelt-cinematic-pilot/*.jpg
            /tmp/kelt-cinematic-pilot/*.png
            /tmp/kelt-cinematic-pilot/cinematic-pilot-manifest.json
          retention-days: 14
          if-no-files-found: warn
      - name: Record objective review, no publishing
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS: ${{ job.status }}
        run: |
          python - <<'PY' > /tmp/review.txt
          from pathlib import Path
          import json,os
          print('### KELT-9b · primer lote de imágenes FLUX (solo revisión)')
          print('- Ejecución:',os.environ['RUN'])
          print('- Estado:',os.environ['STATUS'])
          print('- Publicación en YouTube: DESACTIVADA')
          f=Path('/tmp/kelt-cinematic-pilot/cinematic-pilot-manifest.json')
          if f.exists():
              d=json.loads(f.read_text())
              print('- Solicitudes de imagen realizadas:',d['completed_image_requests'],'/ 3')
              for x in d['scenes']:
                  status='generada' if x.get('image_generated') else 'pendiente'
                  verdict=x['vision']['decision']
                  print('- Escena',x['scene'],status,'| QA visual:',verdict,
                        '| evidencia:',str(x['vision'].get('evidence',''))[:350])
              print('- Aprobación editorial humana:',d['human_visual_approved'])
              print('- Apto para publicación:',d['ready_to_publish'])
          else:
              print('- Sin manifiesto. Fallo previo a la generación.')
          PY
          gh issue comment 20 --repo "$REPO" --body-file /tmp/review.txt
