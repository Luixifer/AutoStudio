name: AutoStudio - live bounded duplicate repair one-shot
on:
  push:
    branches:
      - test/live-duplicate-recovery-20261119
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  text-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Regressions
        run: python -m unittest tests.test_shot_preflight tests.test_visual_distinctness -q
      - name: Restore approved 7 shot prefix
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p .autostudio
          gh run download 44530240971 --repo "$REPO" --name AutoStudio-Newline-Repair-Checkpoint --dir .autostudio
          test -s .autostudio/shot-checkpoint.json
      - name: Cloudflare real text-only shot planning
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python -m scripts.shot_preflight \
            --story requests/51cc3cfcdfef933be83eb3d4bb739472/storyboard.json \
            --out /tmp/full-shot-plan.json \
            --checkpoint .autostudio/shot-checkpoint.json
      - name: Preserve verified partial shots or complete plan
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AutoStudio-Duplicate-Recovery-Checkpoint
          path: .autostudio/shot-checkpoint.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Archive full verified plan when available
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AutoStudio-Full-Shot-Plan
          path: /tmp/full-shot-plan.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Report technical status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS: ${{ job.status }}
        run: |
          python - <<'PY' > /tmp/report.md
          from pathlib import Path
          import json,os
          print("### AutoStudio: retry único adicional de planos duplicados (Cloudflare real)")
          print("- Ejecución:",os.environ["RUN_URL"])
          print("- Estado:",os.environ["STATUS"])
          print("- Imágenes nuevas: 0; publicación: desactivada")
          cp=Path(".autostudio/shot-checkpoint.json")
          if cp.is_file():
              d=json.loads(cp.read_text())
              print("- Escenas aprobadas y conservadas:",len(d["accepted_shots"]))
          out=Path("/tmp/full-shot-plan.json")
          if out.is_file():
              d=json.loads(out.read_text())
              print("- Plan textual completo:",len(d["shots"]))
              for x in d["shots"]:
                  print("- Escena",x["scene"],"|",x["visible_action"])
          else:
              print("- Plan aún no aprobado; FLUX bloqueado")
          PY
          gh issue comment 20 --repo "$REPO" --body-file /tmp/report.md
