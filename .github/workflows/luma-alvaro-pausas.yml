name: Luma - Alvaro pausas corregidas
on:
  push:
    branches: [experiments/luma-narrator-voices]
    paths:
      - 'scripts/luma_alvaro_pausas.py'
      - '.github/workflows/luma-alvaro-pausas.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install edge-tts
      - name: Generate natural and bedtime narration with explicit pauses
        run: python -m scripts.luma_alvaro_pausas
      - uses: actions/upload-artifact@v4
        with:
          name: luma-alvaro-pausas-naturales
          path: out/luma-alvaro-pausas/
          retention-days: 14
          if-no-files-found: error
