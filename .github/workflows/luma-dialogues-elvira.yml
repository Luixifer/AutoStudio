name: Luma - dialogos Elvira y Ximena
on:
  push:
    branches: [experiments/luma-narrator-voices]
    paths:
      - 'scripts/luma_dialogues_elvira.py'
      - '.github/workflows/luma-dialogues-elvira.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/luma_dialogues_elvira.py'
      - '.github/workflows/luma-dialogues-elvira.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dialogues:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install synthesis and audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install edge-tts
      - name: Generate scene and character dialogue previews
        run: python -u -m scripts.luma_dialogues_elvira
      - uses: actions/upload-artifact@v4
        with:
          name: luma-dialogos-elvira
          path: out/luma-dialogos-elvira/
          retention-days: 14
          if-no-files-found: error
