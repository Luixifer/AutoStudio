name: Luma - tres voces Alex (prueba)
on:
  push:
    branches:
      - experiments/luma-narrator-voices
    paths:
      - 'scripts/luma_voice_samples.py'
      - '.github/workflows/luma-narrator-voices.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/luma_voice_samples.py'
      - '.github/workflows/luma-narrator-voices.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sample-voices:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local neural voice runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy onnxruntime kokoro-onnx==0.6.1 espeakng-loader
      - name: Render 3 Alex voice samples locally
        run: python -m scripts.luma_voice_samples
      - name: Upload the three original WAV files
        uses: actions/upload-artifact@v4
        with:
          name: luma-alex-tres-voces
          path: out/luma-voice-comparison/
          if-no-files-found: error
          retention-days: 14
