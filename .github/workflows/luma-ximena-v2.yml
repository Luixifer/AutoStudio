name: Luma - Ximena v2 pausas expresivas
on:
  push:
    branches: [experiments/luma-narrator-voices]
    paths:
      - 'scripts/luma_ximena_v2.py'
      - '.github/workflows/luma-ximena-v2.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/luma_ximena_v2.py'
      - '.github/workflows/luma-ximena-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install narrator tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install edge-tts
      - name: Generate two Ximena v2 samples
        run: python -m scripts.luma_ximena_v2
      - uses: actions/upload-artifact@v4
        with:
          name: luma-ximena-v2-pausas
          path: out/luma-ximena-v2/
          if-no-files-found: error
          retention-days: 14
