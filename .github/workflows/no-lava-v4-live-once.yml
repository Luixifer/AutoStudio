name: AutoStudio - real no lava grounding v4 once
on:
  push:
    branches:
      - test/live-no-lava-v4-20261119
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Offline tests
        run: python -m unittest tests.test_shot_preflight tests.test_visual_distinctness -q
      - name: Restore real signed five shot checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p .autostudio
          gh run download 44526008303 --repo "$REPO" --name AutoStudio-Short-Repair-V3-Checkpoint --dir .autostudio
          test -s .autostudio/shot-checkpoint.json
      - name: Real Cloudflare text-only planning
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python -m scripts.shot_preflight \
            --story requests/51cc3cfcdfef933be83eb3d4bb739472/storyboard.json \
            --out /tmp/plan.json \
            --checkpoint .autostudio/shot-checkpoint.json
      - name: Preserve any approved batches
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AutoStudio-No-Lava-V4-Checkpoint
          path: .autostudio/shot-checkpoint.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Report results, no publishing
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS: ${{ job.status }}
        run: |
          python - <<'PY' > /tmp/report.md
          import json,os
          from pathlib import Path
          print("### AutoStudio: primer ensayo de barrera de lava inventada")
          print("- Ejecución:",os.environ["RUN"])
          print("- Estado:",os.environ["STATUS"])
          print("- Imágenes FLUX: 0; publicación YouTube desactivada")
          cp=Path(".autostudio/shot-checkpoint.json")
          if cp.exists():
              d=json.loads(cp.read_text())
              print("- Escenas firmadas y guardadas:",len(d["accepted_shots"]))
          else:
              print("- Sin checkpoint")
          p=Path("/tmp/plan.json")
          if p.exists():
              d=json.loads(p.read_text())
              print("- Escenas del plan completo:",len(d["shots"]))
              for item in d["shots"]:
                  print("- Escena",item["scene"],"|",item["visible_action"])
          else:
              print("- Plan todavía no validado, imágenes bloqueadas")
          PY
          gh issue comment 20 --repo "$REPO" --body-file /tmp/report.md
