name: Pepe 81 · ilustraciones originales y cruce 3D
on:
  push:
    branches: ['codex/pepe-episode-81']
    paths: ['triggers/pepe81-art.txt']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        part: ['stills-0','stills-1','stills-2','stills-3','motion-0','motion-1','motion-2','motion-3']
    env:
      PART: ${{ matrix.part }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Blender oficial de Ubuntu · Cycles CPU · sin servicios de pago
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender
          blender --version
      - name: Renderizar planos individuales o fotogramas reales del cruce
        run: |
          python3 - <<'PY'
          import os,subprocess
          part=os.environ['PART'];kind,chunk=part.split('-');chunk=int(chunk)
          command=['blender','-b','-t','4','--python','scripts/pepe/art.py','--','--out','reports/pepe-assets']
          if kind=='stills':command+=['--shots',*[str(n) for n in range(1+chunk,27,4)]]
          else:command+=['--motion-start',str(chunk*21),'--motion-end',str((chunk+1)*21),'--motion-total','84']
          subprocess.run(command,check=True)
          PY
      - name: Entregar recursos con hashes y maestro editable
        run: python3 -m scripts.pepe.publish --input reports/pepe-assets --part "$PART"
