name: AutoStudio PERSONAL · tres temas científicos reales
on:
  push:
    branches: [feature/quality-gate-30]
    paths:
      - '.github/workflows/personal-catalog-three.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matrix-original-science:
    strategy:
      fail-fast: false
      matrix:
        theme: [auroras, dna, volcanoes]
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Preparar herramientas de vídeo y voz neural sin API
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check -r requirements-neural.txt
          python scripts/fetch_voice.py
      - name: Verificar todos los guiones y sus derechos
        run: python -m unittest discover -s tests -p 'test_personal_catalog.py' -v
      - name: Generar tema completo con Álex
        env:
          TOPIC: ${{ matrix.theme }}
        run: |
          python -m scripts.personal_catalog "$TOPIC" --out "/tmp/autostudio-$TOPIC" --render
          python - <<'PY'
          import json,os
          from pathlib import Path
          directory=Path("/tmp/autostudio-"+os.environ["TOPIC"])
          report=json.loads((directory/"render/quality-report.json").read_text(encoding="utf-8"))
          assert report["technical_passed"]
          assert not report["ready_to_publish"]
          assert report["visual_audit"]["shots_checked"]==8
          assert not report["visual_audit"]["technical_errors"]
          print("CATALOG_THEME",os.environ["TOPIC"])
          print("CATALOG_SECONDS",report["seconds"])
          print("CATALOG_HASH",report["sha256"])
          print("CATALOG_VISUAL_WARNINGS",report["visual_audit"]["warnings"])
          PY
      - name: Guardar MP4 y hoja de contactos
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AutoStudio-Personal-${{ matrix.theme }}-Alex-REVIEW
          path: |
            /tmp/autostudio-${{ matrix.theme }}/render/autostudio-personal-REVIEW.mp4
            /tmp/autostudio-${{ matrix.theme }}/render/captions.srt
            /tmp/autostudio-${{ matrix.theme }}/render/contacto-planos.jpg
            /tmp/autostudio-${{ matrix.theme }}/render/visual-audit.json
            /tmp/autostudio-${{ matrix.theme }}/render/quality-report.json
            /tmp/autostudio-${{ matrix.theme }}/storyboard/storyboard.json
          if-no-files-found: error
          retention-days: 7
