name: AutoStudio - safe policy rewind on real signed checkpoint once
on:
  push:
    branches:
      - test/live-policy-rewind-v5-20261119
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  text-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify code
        run: python -m unittest tests.test_shot_preflight tests.test_visual_distinctness -q
      - name: Retrieve authentic five-shot checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p .autostudio
          gh run download 44526710502 --repo "$REPO" --name AutoStudio-No-Lava-V4-Checkpoint --dir .autostudio
          test -s .autostudio/shot-checkpoint.json
      - name: Verify new policy rewinds old signed checkpoint before requests
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from scripts import shot_preflight as p
          story=json.loads(Path("requests/51cc3cfcdfef933be83eb3d4bb739472/storyboard.json").read_text())
          old=json.loads(Path(".autostudio/shot-checkpoint.json").read_text())
          safe,size=p._read_checkpoint(".autostudio/shot-checkpoint.json",story,os.environ["CLOUDFLARE_API_TOKEN"])
          print("Prior signed checkpoint shots:",len(old["accepted_shots"]))
          print("SAFE shots under current science constraints:",len(safe))
          print("Revalidated prefix ends at:",safe[-1]["scene"] if safe else "none")
          assert len(safe)<len(old["accepted_shots"])
          PY
      - name: Continue real Cloudflare preproduction without FLUX
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python -m scripts.shot_preflight \
            --story requests/51cc3cfcdfef933be83eb3d4bb739472/storyboard.json \
            --out /tmp/plan.json \
            --checkpoint .autostudio/shot-checkpoint.json
      - name: Preserve any newly reviewed safe batches
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AutoStudio-Policy-Rewind-V5-Checkpoint
          path: .autostudio/shot-checkpoint.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Log results without images or publishing
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS: ${{ job.status }}
        run: |
          python - <<'PY' > /tmp/report.md
          import json,os
          from pathlib import Path
          print("### AutoStudio · prueba real de retroceso seguro del checkpoint")
          print("- Ejecución:",os.environ["RUN"])
          print("- Estado:",os.environ["STATUS"])
          print("- FLUX: 0 imágenes; publicación automática: desactivada")
          cp=Path(".autostudio/shot-checkpoint.json")
          if cp.exists():
              d=json.loads(cp.read_text())
              print("- Escenas presentes en archivo firmado:",len(d["accepted_shots"]))
          full=Path("/tmp/plan.json")
          if full.exists():
              d=json.loads(full.read_text())
              print("- Plan completo:",len(d["shots"]))
          else:
              print("- Plan aún no aprobado por todos los controles")
          PY
          gh issue comment 20 --repo "$REPO" --body-file /tmp/report.md
