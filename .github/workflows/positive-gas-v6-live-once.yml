name: AutoStudio - positive grounded gas live one-shot
on:
  push:
    branches:
      - test/live-positive-gas-v6-20261119
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify offline regressions
        run: python -m unittest tests.test_shot_preflight tests.test_visual_distinctness -q
      - name: Restore authentic earlier signed checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p .autostudio
          gh run download 44527408832 --repo "$REPO" --name AutoStudio-Policy-Rewind-V5-Checkpoint --dir .autostudio
          test -s .autostudio/shot-checkpoint.json
      - name: Verify and persist exactly the safe reviewed prefix
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from scripts import shot_preflight as p
          path=Path(".autostudio/shot-checkpoint.json")
          story=json.loads(Path("requests/51cc3cfcdfef933be83eb3d4bb739472/storyboard.json").read_text())
          verified,size=p._read_checkpoint(path,story,os.environ["CLOUDFLARE_API_TOKEN"])
          persisted=json.loads(path.read_text())
          print("Signed checkpoint safely preserved:",len(verified),"scenes")
          assert len(verified)==2 and len(persisted["accepted_shots"])==2
          PY
      - name: Cloudflare real text-only plan
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python -m scripts.shot_preflight \
            --story requests/51cc3cfcdfef933be83eb3d4bb739472/storyboard.json \
            --out /tmp/complete-plan.json \
            --checkpoint .autostudio/shot-checkpoint.json
      - name: Archive safe prefix even if Cloudflare rejects the next scene
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AutoStudio-Positive-Gas-V6-Checkpoint
          path: .autostudio/shot-checkpoint.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Record technical result
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS: ${{ job.status }}
        run: |
          python - <<'PY' > /tmp/report.md
          import json,os
          from pathlib import Path
          print("### AutoStudio · ensayo de preproducción tras descartar imágenes físicamente incorrectas")
          print("- Ejecución:",os.environ["RUN"])
          print("- Estado:",os.environ["STATUS"])
          print("- FLUX: 0 imágenes; publicación automática desactivada")
          cp=Path(".autostudio/shot-checkpoint.json")
          if cp.exists():
              d=json.loads(cp.read_text())
              print("- Escenas firmadas y ahora válidas:",len(d["accepted_shots"]))
          p=Path("/tmp/complete-plan.json")
          if p.exists():
              d=json.loads(p.read_text())
              print("- Plan textual completo aprobado:",len(d["shots"]))
          else:
              print("- Plan aún incompleto, imágenes no autorizadas")
          PY
          gh issue comment 20 --repo "$REPO" --body-file /tmp/report.md
