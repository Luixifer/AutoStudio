name: AutoStudio · Motor orbital 3D conceptual (prueba aislada)
on:
  push:
    branches:
      - feat/procedural-orbit-engine-20261119
permissions:
  contents: read
jobs:
  render-orbit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install local rendering tools
        run: |
          python -m pip install Pillow imageio-ffmpeg
      - name: Test scene geometry before rendering
        run: python -m unittest tests.test_procedural_orbit tests.test_procedural_molecule -v
      - name: Render actual short H264 preview
        run: python -m scripts.procedural_orbit --out /tmp/orbit-preview
      - name: Render real dissociation and recombination motion
        run: |
          python -m scripts.procedural_molecule --mode dissociation --out /tmp/orbit-preview
          python -m scripts.procedural_molecule --mode recombination --out /tmp/orbit-preview
      - name: Verify real decoded video and manifest
        run: |
          python - <<'PY'
          import json,subprocess,hashlib
          from pathlib import Path
          import imageio_ffmpeg
          root=Path('/tmp/orbit-preview')
          movie=root/'orbit-preview.mp4'
          manifest=json.loads((root/'orbit-manifest.json').read_text())
          assert movie.is_file() and movie.stat().st_size > 10000
          assert manifest['frames']==120 and manifest['not_to_scale']
          assert manifest['width']==1280 and manifest['height']==720
          assert manifest['fps']==24 and manifest['duration_seconds']==5
          assert not manifest['ready_to_publish'] and not manifest['youtube_enabled']
          assert manifest['sha256']==hashlib.sha256(movie.read_bytes()).hexdigest()
          reader=imageio_ffmpeg.read_frames(str(movie))
          meta=next(reader)
          assert meta['size']==(1280,720),meta
          assert abs(meta['fps']-24)<0.01,meta
          decoded=sum(1 for _ in reader)
          assert decoded==120,decoded
          for mode in ('dissociation','recombination'):
              path=root/f'hydrogen-{mode}.mp4'
              assert path.is_file()
              metadata=json.loads((root/f'hydrogen-{mode}-manifest.json').read_text())
              assert metadata['frames']==120
              assert metadata['sha256']==hashlib.sha256(path.read_bytes()).hexdigest()
              assert not metadata['electron_stripping_depicted']
              assert not metadata['ready_to_publish']
              stream=imageio_ffmpeg.read_frames(str(path))
              head=next(stream)
              assert head['size']==(1280,720)
              assert sum(1 for _ in stream)==120
          print('PASS: three actual decoded H264 clips, each 120 frames, 1280x720 at 24fps')

          PY
      - name: Archive MP4, still and manifest, never publish
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AutoStudio-Orbita-Procedural-5s-Revision
          path: |
            /tmp/orbit-preview/orbit-preview.mp4
            /tmp/orbit-preview/orbit-first-frame.jpg
            /tmp/orbit-preview/orbit-manifest.json
            /tmp/orbit-preview/hydrogen-*.mp4
            /tmp/orbit-preview/hydrogen-*.jpg
            /tmp/orbit-preview/hydrogen-*-manifest.json
          retention-days: 14
          if-no-files-found: warn
