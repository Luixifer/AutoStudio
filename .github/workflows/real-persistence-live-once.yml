name: AutoStudio - checkpoint live production preflight one-shot
on:
  push:
    branches:
      - test/live-checkpoint-persistence-20261119
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  text-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Offline tests
        run: python -m unittest tests.test_shot_preflight tests.test_visual_distinctness -q
      - name: Retrieve previous signed checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          CURRENT_RUN: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .autostudio
          id=$(gh api "repos/$REPO/actions/artifacts?name=AutoStudio-Real-Shot-Checkpoint&per_page=100" |
            jq -r --arg branch "$BRANCH" --arg current "$CURRENT_RUN" '
              [.artifacts[] | select(.expired == false and .workflow_run.head_branch == $branch) |
               select((.workflow_run.id | tostring) != $current)]
              | sort_by(.created_at) | last | .workflow_run.id // empty')
          if [[ -n "$id" ]]; then
            gh run download "$id" --repo "$REPO" --name AutoStudio-Real-Shot-Checkpoint --dir .autostudio
            test -s .autostudio/shot-checkpoint.json
            echo "Restored signed prefix from $id"
          else
            echo "No earlier checkpoint"
          fi
      - name: Real Cloudflare preflight, no FLUX
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -m scripts.shot_preflight --story requests/51cc3cfcdfef933be83eb3d4bb739472/storyboard.json --out /tmp/shot-plan.json --checkpoint .autostudio/shot-checkpoint.json
      - name: Preserve approved prefix even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AutoStudio-Real-Shot-Checkpoint
          path: .autostudio/shot-checkpoint.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Report state, never publish
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS: ${{ job.status }}
        run: |
          python - <<'PY' > /tmp/report.md
          from pathlib import Path
          import os,json
          print("### AutoStudio · persistencia real de planos revisados")
          print("- Ejecución:",os.environ["RUN"])
          print("- Estado:",os.environ["STATUS"])
          print("- FLUX: 0 imágenes; publicación: desactivada")
          cp=Path(".autostudio/shot-checkpoint.json")
          if cp.exists():
              d=json.loads(cp.read_text())
              print("- Escenas preservadas y autenticadas:",len(d["accepted_shots"]))
          else:
              print("- No hay escenas preservadas")
          p=Path("/tmp/shot-plan.json")
          if p.exists():
              d=json.loads(p.read_text())
              print("- Plan completo validado:",len(d["shots"]))
          else:
              print("- Plan aún incompleto o rechazado")
          PY
          gh issue comment 20 --repo "$REPO" --body-file /tmp/report.md

# Second run: verify recovery from the previous authenticated four-shot artifact.
