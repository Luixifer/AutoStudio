name: AutoStudio · Revisar imagen existente con IA (cero FLUX)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  recheck-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Pruebas offline de fallback y seguridad
        run: python -m unittest tests.test_recheck_visual_artifact tests.test_visual_autopilot tests.test_visual_diagnostics -v
      - name: Descargar la IMAGEN YA GENERADA de Actions (no crear otra)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/supervisor-real-smoke.yml/runs?per_page=20" --jq '[.workflow_runs[] | select(.conclusion == "failure")][0].id')
          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "Original one-scene run unavailable"; exit 1
          fi
          mkdir -p original
          gh run download "$id" --repo "$GITHUB_REPOSITORY" --name "AutoStudio-Supervisor-Prueba-Una-Escena" --dir original
          test -s original/scene_01_v1.jpg
          test -s original/visual-supervision-manifest.json
      - name: Reusar exactamente la imagen existente y revisar con Moondream
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python -m scripts.recheck_visual_artifact --manifest original/visual-supervision-manifest.json --out replay/vision-recheck.json
      - name: Archivar diagnóstico nuevo sin regenerar imagen
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AutoStudio-Recheck-Visual-Sin-Generacion
          path: replay/vision-recheck.json
          retention-days: 3
          if-no-files-found: warn
