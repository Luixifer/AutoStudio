name: AutoStudio · Revisar imagen existente con IA (cero FLUX)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  recheck-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Pruebas offline de fallback y seguridad
        run: python -m unittest tests.test_recheck_visual_artifact tests.test_vision_gemma tests.test_visual_autopilot tests.test_visual_diagnostics -v
      - name: Descargar la IMAGEN YA GENERADA de Actions (no crear otra)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/supervisor-real-smoke.yml/runs?per_page=20" --jq '[.workflow_runs[] | select(.conclusion == "failure")][0].id')
          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "Original one-scene run unavailable"; exit 1
          fi
          mkdir -p original
          gh run download "$id" --repo "$GITHUB_REPOSITORY" --name "AutoStudio-Supervisor-Prueba-Una-Escena" --dir original
          test -s original/scene_01_v1.jpg
          test -s original/visual-supervision-manifest.json
      - name: Reusar exactamente la imagen existente y revisar con Moondream
        id: replay
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python -m scripts.recheck_visual_artifact --manifest original/visual-supervision-manifest.json --out replay/vision-recheck.json --provider gemma
      - name: Archivar diagnóstico nuevo sin regenerar imagen
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AutoStudio-Recheck-Visual-Sin-Generacion
          path: replay/vision-recheck.json
          retention-days: 3
          if-no-files-found: warn
      - name: Publicar estado minimo en incidencia tecnica (sin pedir capturas)
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          JOB_STATUS: ${{ job.status }}
          REPLAY_STATUS: ${{ steps.replay.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/visual-status.md
          import os,json
          from pathlib import Path
          p=Path("replay/vision-recheck.json")
          print("### Comprobación automática de imagen ya existente")
          print("- Ejecución:",os.environ["RUN_URL"])
          print("- Trabajo:",os.environ["JOB_STATUS"])
          print("- Inspección con modelo:",os.environ["REPLAY_STATUS"])
          print("- Imágenes FLUX nuevas: **0**")
          if p.is_file():
              r=json.loads(p.read_text())
              v=r.get("verdict",{})
              print("- Resultado visual:",str(v.get("decision","UNSURE"))[:25])
              print("- Método de comprobación:",str(v.get("method","unknown"))[:60])
              print("- Motivo (resumen):",str(v.get("evidence","not available")).replace("\\n"," ")[:230])
              print("- Claves de respuesta:",", ".join(str(x)[:35] for x in v.get("response_keys",[])[:8]))
              print("- Forma de respuesta:",str(v.get("response_shape",{}))[:480])
          else:
              print("- Resultado: no se generó el manifiesto de revisión; comprobar logs internos")
          PY
          gh issue comment 20 --repo "$GH_REPO" --body-file /tmp/visual-status.md
