name: AutoStudio · Recuperar documental KELT-9b (sin nuevas imagenes)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/recover_supervised_images.py'
      - 'tests/test_recover_supervised_images.py'
      - '.github/workflows/recover-kelt10-video.yml'
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  recover-ten-scenes:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Obtener codigo experimental
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: development
      - name: Obtener motor de voz Álex y montaje congelado
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: e722cf94007e326fd6a4537ad57ebbc60b43faa9
          path: engine
      - name: Obtener guion original sin modificar
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: uploads
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Ejecutar pruebas SIN Cloudflare
        working-directory: development
        run: |
          python -m unittest tests.test_recover_supervised_images tests.test_stage_supervised tests.test_vision_gemma -v
          python -m py_compile scripts/recover_supervised_images.py
      - name: Recuperar paquete original del 19-11-2026 desde GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p original-data
          gh run download 44478832858 --repo "$GITHUB_REPOSITORY" \
            --name "AutoStudio-Supervisor-Visual-REVISION" --dir original-data
          find original-data -maxdepth 4 -name visual-supervision-manifest.json -print
          test "$(find original-data -name visual-supervision-manifest.json | wc -l)" -eq 1
          echo "SOURCE_MANIFEST=$(find original-data -name visual-supervision-manifest.json)" >> "$GITHUB_ENV"
      - name: Revisar SOLO las escenas 1 y 10 (cero peticiones FLUX)
        working-directory: development
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python -m scripts.recover_supervised_images \
            --manifest "../$SOURCE_MANIFEST" --out ../recovered-art --scenes 10
      - name: Preparar storyboard solo si las diez imágenes estan aprobadas
        working-directory: development
        run: |
          python -m scripts.stage_supervised \
            --storyboard ../uploads/requests/51cc3cfcdfef933be83eb3d4bb739472/storyboard.json \
            --manifest ../recovered-art/visual-supervision-manifest.json \
            --out ../reviewed-storyboard
      - name: Instalar motor de voz y FFmpeg para montar MP4
        working-directory: engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check -r requirements-neural.txt
          python scripts/fetch_voice.py
      - name: Montar documental y comprobar QA técnico
        working-directory: engine
        run: |
          python -m scripts.personal_prepare ../reviewed-storyboard/storyboard.json --out ../prepared
          python -m scripts.personal_editor ../prepared/input/studio-ready.json --out ../final-render
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path("../final-render/quality-report.json").read_text(encoding="utf-8"))
          assert q["technical_passed"] and not q["ready_to_publish"] and not q["youtube_enabled"]
          assert Path("../final-render/autostudio-personal-REVIEW.mp4").stat().st_size>100_000
          print("SUPERVISED_KELT10_MP4_OK",q["sha256"])
          PY
      - name: Conservar todas las imágenes, evaluaciones y vídeo sin publicar
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AutoStudio-KELT9b-Recuperacion-Supervisada
          path: |
            recovered-art/*.jpg
            recovered-art/*.png
            recovered-art/visual-supervision-manifest.json
            recovered-art/recovery-report.json
            reviewed-storyboard/storyboard.json
            reviewed-storyboard/image-staging-report.json
            final-render/autostudio-personal-REVIEW.mp4
            final-render/quality-report.json
            final-render/contacto-planos.jpg
          retention-days: 3
          if-no-files-found: warn
      - name: Informar resultado directamente en GitHub, sin pedir archivos al usuario
        if: ${{ always() && github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY' > /tmp/kelt-recovery-report.md
          from pathlib import Path
          import os,json
          print("### KELT-9b · Recuperación de diez imágenes sin FLUX")
          print("- Ejecución:",os.environ["RUN_URL"])
          print("- Trabajo:",os.environ["RESULT"])
          print("- Generaciones FLUX nuevas: **0**")
          p=Path("recovered-art/recovery-report.json")
          if p.is_file():
              r=json.loads(p.read_text(encoding="utf-8"))
              print("- Originales conservados:",r.get("original_image_requests"))
              print("- Revisiones nuevas de visión:",r.get("reinspection_requests"))
              print("- Escenas aprobadas:",r.get("approved_scenes"),"/",r.get("total_scenes"))
              print("- Todas aprobadas:",r.get("all_scenes_approved"))
              manifest=json.loads(Path("recovered-art/visual-supervision-manifest.json").read_text(encoding="utf-8"))
              for i in (0,9):
                  entry=manifest["scenes"][i]
                  review=entry["candidates"][0]["vision"]
                  print("- Escena",entry["scene"],":",review.get("decision","UNSURE"),
                        "-",str(review.get("evidence","unknown")).replace("\n"," ")[:175])
          else:
              print("- Recuperación: no finalizada; consultar registros del workflow")
          qa=Path("final-render/quality-report.json")
          if qa.is_file():
              report=json.loads(qa.read_text(encoding="utf-8"))
              print("- MP4 montado y QA técnico:",report.get("technical_passed",False))
              print("- Listo para publicación:",False)
          else:
              print("- MP4: no entregado/verificado")
          PY
          gh issue comment 20 --repo "$REPO" --body-file /tmp/kelt-recovery-report.md
