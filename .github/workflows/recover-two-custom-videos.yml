name: AutoStudio · Recuperar dos vídeos móviles tras corregir la ruta
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-two-custom-videos.yml'
permissions:
  actions: write
  contents: read
jobs:
  redispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        request_id:
          - 51cc3cfcdfef933be83eb3d4bb739472
          - f39d5124ca54c250fa7805efcf8725e8
    steps:
      - name: Reanudar solicitud usando las imágenes y el guion YA subidos
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ matrix.request_id }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/{os.environ['REPO']}/actions/workflows/personal-custom.yml/dispatches"
          payload = json.dumps({"ref":"main", "inputs":{"request_id":os.environ["REQUEST_ID"]}}).encode()
          req = urllib.request.Request(url, data=payload, method="POST", headers={
            "Authorization": "Bearer "+os.environ["GH_TOKEN"],
            "Accept": "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28",
            "Content-Type": "application/json",
            "User-Agent": "AutoStudio-Personal-Recovery"
          })
          with urllib.request.urlopen(req,timeout=20) as response:
            assert response.status==204, f"Unexpected response {response.status}"
          print("REQUEST_REDISPATCHED",os.environ["REQUEST_ID"])
          PY

# Re-render with smooth 60 fps camera engine; reuses the two uploaded requests.
