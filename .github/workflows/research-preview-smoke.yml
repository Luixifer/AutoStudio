name: AutoStudio LAB · prueba MP4 de investigación
on:
  push:
    branches:
      - feature/topic-intake-v04
    paths:
      - 'scripts/research_preview.py'
      - 'scripts/spanish_draft.py'
      - '.github/workflows/research-preview-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experimental-video:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Instalar herramientas locales gratuitas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Preparar tema real con enlaces NASA
        run: |
          python -m scripts.research_pipeline "¿Qué ocurre dentro de un agujero negro?" --out-dir /tmp/autostudio-lab-research
      - name: Producir MP4 experimental y validar contenido mínimo
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.research_preview import produce
          path=next(Path('/tmp/autostudio-lab-research').glob('*.json'))
          package=json.loads(path.read_text(encoding='utf-8'))
          result=produce(package,Path('/tmp/autostudio-lab-output'))
          assert result["scene_count"]>=3
          assert result["scientifically_approved"] is False
          assert result["youtube_enabled"] is False
          print("PREVIEW_MP4_SHA256:",result["sha256"])
          print("PREVIEW_SCENES:",result["scene_count"])
          print("PREVIEW_SECONDS_ESTIMATE:",result["estimated_seconds"])
          PY
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 /tmp/autostudio-lab-output/autostudio-black-hole-REVIEW-ONLY.mp4
      - name: Guardar vídeo experimental descargable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AutoStudio-BlackHole-UNREVIEWED-video-preview
          path: |
            /tmp/autostudio-lab-output/autostudio-black-hole-REVIEW-ONLY.mp4
            /tmp/autostudio-lab-output/preview-report.json
          if-no-files-found: error
          retention-days: 7
