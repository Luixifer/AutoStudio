name: AutoStudio - resume four real scenes with strict numbering
on:
  push:
    branches:
      - test/checkpoint-resume-v2-20261119
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  text-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Offline tests
        run: python -m unittest tests.test_shot_preflight tests.test_visual_distinctness -q
      - name: Restore four previously approved REAL scenes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p .autostudio
          gh run download 44521047440 --repo "$REPO" --name AutoStudio-Real-Shot-Checkpoint --dir .autostudio
          test -s .autostudio/shot-checkpoint.json
          echo "Restored archived signed Cloudflare prefix from run 44521047440"
      - name: Continue real Cloudflare preflight, zero FLUX
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -m scripts.shot_preflight --story requests/51cc3cfcdfef933be83eb3d4bb739472/storyboard.json --out /tmp/plan.json --checkpoint .autostudio/shot-checkpoint.json
      - name: Preserve signed prefix even after failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AutoStudio-Real-Resumed-Checkpoint
          path: .autostudio/shot-checkpoint.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Report verification without publishing
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS: ${{ job.status }}
        run: |
          python - <<'PY' > /tmp/report.md
          from pathlib import Path
          import os,json
          print("### AutoStudio · reanudación real desde cuatro escenas ya aprobadas")
          print("- Ejecución:",os.environ["RUN"])
          print("- Resultado:",os.environ["STATUS"])
          print("- FLUX: 0 imágenes; YouTube: publicación automática desactivada")
          p=Path(".autostudio/shot-checkpoint.json")
          if p.exists():
              d=json.loads(p.read_text())
              print("- Escenas conservadas:",len(d["accepted_shots"]))
          else:
              print("- No se pudo recuperar checkpoint")
          result=Path("/tmp/plan.json")
          if result.exists():
              d=json.loads(result.read_text())
              print("- Planos completos aprobados:",len(d["shots"]))
              for shot in d["shots"]:
                  print("- Escena",shot["scene"],shot["scale"],shot["angle"],shot["role"],"|",shot["visible_action"])
          else:
              print("- Plan aún no aprobado, sin nuevas imágenes")
          PY
          gh issue comment 20 --repo "$REPO" --body-file /tmp/report.md
