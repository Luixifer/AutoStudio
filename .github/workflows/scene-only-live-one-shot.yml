name: AutoStudio - scene only live preflight one-shot
on:
  push:
    branches:
      - test/scene-only-live-20261119
permissions:
  contents: read
  issues: write
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Test offline
        run: python -m unittest tests.test_shot_preflight tests.test_visual_distinctness -q
      - name: Test real de texto (sin FLUX)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -m scripts.shot_preflight --story requests/51cc3cfcdfef933be83eb3d4bb739472/storyboard.json --out /tmp/plan.json
      - name: Dejar evidencia en GitHub
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS: ${{ job.status }}
        run: |
          python - <<'PY' > /tmp/report.md
          from pathlib import Path
          import os,json
          print("### AutoStudio · reparación puntual de planos, ensayo real solo texto")
          print("- Ejecución:",os.environ["URL"])
          print("- Estado:",os.environ["STATUS"])
          print("- Imágenes nuevas: 0; publicación: desactivada")
          p=Path("/tmp/plan.json")
          if p.exists():
              d=json.loads(p.read_text())
              print("- Planos completos:",len(d["shots"]))
              for x in d["shots"]:
                  print("- Escena",x["scene"],x["scale"],x["angle"],"|",x["visible_action"])
          else:
              print("- Plan rechazado; ver registro para la causa exacta")
          PY
          gh issue comment 20 --repo "$REPO" --body-file /tmp/report.md
