name: AutoStudio - real final shot science integrity once
on:
  push:
    branches:
      - test/science-last-shot-real-20261119
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  text-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify regression suite
        run: python -m unittest tests.test_shot_preflight tests.test_visual_distinctness -q
      - name: Download actual ten-shot signed checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p .autostudio
          gh run download 44542186491 --repo "$REPO" --name AutoStudio-Camera-Diversity-Checkpoint --dir .autostudio
          test -s .autostudio/shot-checkpoint.json
      - name: Prove last unsupported scientific shot is removed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          from scripts import shot_preflight as p
          story=json.loads(Path("requests/51cc3cfcdfef933be83eb3d4bb739472/storyboard.json").read_text())
          cp=Path(".autostudio/shot-checkpoint.json")
          signed=json.loads(cp.read_text())
          assert len(signed["accepted_shots"])==10
          assert "ioniz" in signed["accepted_shots"][9]["visible_action"].lower()
          approved,size=p._read_checkpoint(cp,story,os.environ["CLOUDFLARE_API_TOKEN"])
          assert len(approved)==9, f"Expected nine safe scenes, got {len(approved)}"
          assert len(json.loads(cp.read_text())["accepted_shots"])==9
          print("PASS: invalid ionization image rejected; nine safe shots preserved")
          PY
      - name: Generate science-grounded final scene with Cloudflare TEXT ONLY
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python -m scripts.shot_preflight \
            --story requests/51cc3cfcdfef933be83eb3d4bb739472/storyboard.json \
            --out /tmp/science-checked-plan.json \
            --checkpoint .autostudio/shot-checkpoint.json
      - name: Save signed scenes regardless of final shot outcome
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AutoStudio-Scientific-Final-Checkpoint
          path: .autostudio/shot-checkpoint.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Save complete text plan if validated
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AutoStudio-Scientific-Final-Plan
          path: /tmp/science-checked-plan.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Record actual technical result
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS: ${{ job.status }}
        run: |
          python - <<'PY' > /tmp/report.md
          import os,json
          from pathlib import Path
          print("### AutoStudio: control de ionización no narrada y reparación del final")
          print("- Ejecución:",os.environ["RUN"])
          print("- Estado:",os.environ["STATUS"])
          print("- FLUX: 0 imágenes; publicación en YouTube: desactivada")
          cp=Path(".autostudio/shot-checkpoint.json")
          if cp.exists():
              d=json.loads(cp.read_text())
              print("- Escenas conservadas:",len(d["accepted_shots"]))
          p=Path("/tmp/science-checked-plan.json")
          if p.exists():
              d=json.loads(p.read_text())
              print("- Escenas completas:",len(d["shots"]))
              print("- Última escena:",d["shots"][-1]["visible_action"])
              print("- Ciencia externamente verificada:",d["scientific_facts_verified"])
              print("- Autorizado publicar:",d["ready_to_publish"])
          else:
              print("- El plan sigue bloqueado sin imágenes autorizadas")
          PY
          gh issue comment 20 --repo "$REPO" --body-file /tmp/report.md
