name: AutoStudio · Validar variedad de planos antes de FLUX
on:
  push:
    branches: [main]
    paths:
      - 'triggers/semantic-shot-preflight-2026-11-19.txt'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test sin llamadas a modelos
        run: python -m unittest tests.test_shot_preflight tests.test_visual_distinctness -v
      - name: Plan completo con IA de texto, SIN FLUX
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python -m scripts.shot_preflight \
            --story requests/51cc3cfcdfef933be83eb3d4bb739472/storyboard.json \
            --out /tmp/shot-plan.json
      - name: Archivar plan sin generar imágenes
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AutoStudio-Plan-10-Escenas-Diversidad-20261119
          path: /tmp/shot-plan.json
          retention-days: 5
          if-no-files-found: warn
      - name: Informar resultado automáticamente
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY' > /tmp/report.md
          import json,os
          from pathlib import Path
          print("### Planificación de planos KELT-9b · nueva barrera semántica")
          print("- Ejecución:",os.environ["RUN_URL"])
          print("- Resultado:",os.environ["STATUS"])
          print("- Imágenes nuevas FLUX: **0**")
          p=Path("/tmp/shot-plan.json")
          if p.exists():
              d=json.loads(p.read_text(encoding="utf-8"))
              print("- Planos validados:",len(d["shots"]))
              for s in d["shots"]:
                  print("- Escena",s["scene"],":",s["scale"],"/",s["angle"],"/",s["role"],"|",s["visible_action"])
              print("- Publicación automática:",False)
          else:
              print("- Plan rechazado o incompleto: no se ha generado ninguna imagen.")
          PY
          gh issue comment 20 --repo "$REPO" --body-file /tmp/report.md
