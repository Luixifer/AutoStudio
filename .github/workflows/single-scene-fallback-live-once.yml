name: AutoStudio - live fallback verification once
on:
  push:
    branches:
      - test/single-scene-fallback-live-20261119
permissions:
  contents: read
  issues: write
jobs:
  text-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Regression tests
        run: python -m unittest tests.test_shot_preflight tests.test_visual_distinctness -q
      - name: Live Cloudflare shot planning without image generation
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -m scripts.shot_preflight --story requests/51cc3cfcdfef933be83eb3d4bb739472/storyboard.json --out /tmp/plan.json
      - name: Report technical outcome
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS: ${{ job.status }}
        run: |
          python - <<'PY' > /tmp/report.md
          import os,json
          from pathlib import Path
          print("### AutoStudio: ensayo real del fallback por escena, solo texto")
          print("- Ejecución:",os.environ["RUN_URL"])
          print("- Estado:",os.environ["STATUS"])
          print("- FLUX: cero imágenes; YouTube: publicación desactivada")
          p=Path("/tmp/plan.json")
          if p.exists():
              d=json.loads(p.read_text())
              print("- Escenas aprobadas:",len(d["shots"]))
              for x in d["shots"]:
                  print("- Escena",x["scene"],x["scale"],x["angle"],x["role"],"|",x["visible_action"])
          else:
              print("- Plan no autorizado: consultar causa en registro Actions")
          PY
          gh issue comment 20 --repo "$REPO" --body-file /tmp/report.md
