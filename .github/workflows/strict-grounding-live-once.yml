name: AutoStudio - live strict narration repair retry once
on:
  push:
    branches:
      - test/live-semantic-grounding-v2-20261119
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Offline tests
        run: python -m unittest tests.test_shot_preflight tests.test_visual_distinctness -q
      - name: Restore real signed five-shot checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p .autostudio
          gh run download 44524339441 --repo "$REPO" --name AutoStudio-Grounding-Repair-Checkpoint --dir .autostudio
          test -s .autostudio/shot-checkpoint.json
      - name: Run real Cloudflare text-only narration preflight
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python -m scripts.shot_preflight \
            --story requests/51cc3cfcdfef933be83eb3d4bb739472/storyboard.json \
            --out /tmp/shot-plan.json \
            --checkpoint .autostudio/shot-checkpoint.json
      - name: Preserve all independently reviewed shots
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AutoStudio-Strict-Grounding-Checkpoint
          path: .autostudio/shot-checkpoint.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Record outcome in technical issue only
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS: ${{ job.status }}
        run: |
          python - <<'PY' > /tmp/report.md
          import os,json
          from pathlib import Path
          print("### AutoStudio - nueva prueba del revisor narrativo y reparación puntual")
          print("- Ejecución:",os.environ["RUN"])
          print("- Estado:",os.environ["STATUS"])
          print("- FLUX imágenes nuevas: 0; publicación automática: desactivada")
          cp=Path(".autostudio/shot-checkpoint.json")
          if cp.exists():
              data=json.loads(cp.read_text())
              print("- Escenas comprobadas y preservadas:",len(data["accepted_shots"]))
          out=Path("/tmp/shot-plan.json")
          if out.exists():
              data=json.loads(out.read_text())
              print("- Plan textual completo:",len(data["shots"]))
              for item in data["shots"]:
                  print("- Escena",item["scene"],item["scale"],item["angle"],"|",item["visible_action"])
          else:
              print("- Plan incompleto/rechazado, no se autoriza FLUX")
          PY
          gh issue comment 20 --repo "$REPO" --body-file /tmp/report.md
