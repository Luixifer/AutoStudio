name: AutoStudio - real subject diversity gate and recovery
on:
  push:
    branches:
      - test/subject-diversity-real-20261119
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify all text preflight regressions
        run: python -m unittest tests.test_shot_preflight tests.test_visual_distinctness -q
      - name: Restore historical real 10-shot checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p .autostudio
          gh run download 44539526413 --repo "$REPO" --name AutoStudio-Editorial-Gemma-Checkpoint --dir .autostudio
          test -s .autostudio/shot-checkpoint.json
      - name: Prove historical third repeated visual is rejected
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from scripts import shot_preflight as p
          story=json.loads(Path("requests/51cc3cfcdfef933be83eb3d4bb739472/storyboard.json").read_text())
          cp=Path(".autostudio/shot-checkpoint.json")
          before=json.loads(cp.read_text())
          assert len(before["accepted_shots"])==10
          approved,size=p._read_checkpoint(cp,story,os.environ["CLOUDFLARE_API_TOKEN"])
          assert len(approved) < 10, "An unvaried 10-shot plan must not pass the stronger policy"
          print("HISTORICAL PLAN INVALIDATED",len(before["accepted_shots"]),"->",len(approved),"safe scenes")
          print("Remaining batch size:",size)
          print("Zero image generation")
          PY
      - name: Continue real Cloudflare text planning only
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python -m scripts.shot_preflight \
            --story requests/51cc3cfcdfef933be83eb3d4bb739472/storyboard.json \
            --out /tmp/diverse-plan.json \
            --checkpoint .autostudio/shot-checkpoint.json
      - name: Preserve independently approved scenes
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AutoStudio-Subject-Diversity-Checkpoint
          path: .autostudio/shot-checkpoint.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Archive final text plan only if fully approved
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AutoStudio-Subject-Diversity-Plan
          path: /tmp/diverse-plan.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Record progress, no YouTube or images
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS: ${{ job.status }}
        run: |
          python - <<'PY' > /tmp/report.md
          from pathlib import Path
          import json,os
          print("### AutoStudio: ensayo real de diversidad de sujetos")
          print("- Ejecución:",os.environ["RUN"])
          print("- Estado:",os.environ["STATUS"])
          print("- Imágenes FLUX: 0; publicación: desactivada")
          cp=Path(".autostudio/shot-checkpoint.json")
          if cp.exists():
              d=json.loads(cp.read_text())
              print("- Escenas conservadas y validadas:",len(d["accepted_shots"]))
          p=Path("/tmp/diverse-plan.json")
          if p.exists():
              d=json.loads(p.read_text())
              print("- Plan completo con diversidad:",len(d["shots"]))
              for scene in d["shots"]:
                  print("- Escena",scene["scene"],scene["subject"],"|",scene["visible_action"])
              print("- Ciencia externa verificada:",d["scientific_facts_verified"])
              print("- Listo para publicar:",d["ready_to_publish"])
          else:
              print("- Plan todavía incompleto; no autorizar imágenes")
          PY
          gh issue comment 20 --repo "$REPO" --body-file /tmp/report.md
