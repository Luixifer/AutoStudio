name: Supervised image staging pixel QA
on:
  push:
    branches: [feat/stage-perceptual-gate]
  pull_request:
    paths:
      - "scripts/stage_supervised.py"
      - "tests/test_stage_supervised.py"
      - ".github/workflows/supervised-stage-pixel-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing Pillow dependency
        run: python -m pip install -r requirements.txt
      - name: Exercise approved staging with real pixel checks
        run: |
          python -m unittest discover -s tests -p test_stage_supervised.py -v
          python -m unittest discover -s tests -p test_image_duplicate_qa.py -v
