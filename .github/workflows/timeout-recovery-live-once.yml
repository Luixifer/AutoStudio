name: AutoStudio - text timeout recovery live one-shot
on:
  push:
    branches:
      - test/timeout-recovery-live-20261119
permissions:
  contents: read
  issues: write
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Offline tests
        run: python -m unittest tests.test_shot_preflight tests.test_visual_distinctness -q
      - name: Cloudflare real text preflight, zero FLUX
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -m scripts.shot_preflight --story requests/51cc3cfcdfef933be83eb3d4bb739472/storyboard.json --out /tmp/plan.json
      - name: Log issue outcome
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS: ${{ job.status }}
        run: |
          python - <<'PY' > /tmp/report.md
          import json,os
          from pathlib import Path
          print("### AutoStudio: ensayo de recuperacion de timeout Cloudflare")
          print("- Ejecución:",os.environ["RUN"])
          print("- Estado:",os.environ["STATUS"])
          print("- Imágenes FLUX generadas: 0; publicación automática desactivada")
          p=Path("/tmp/plan.json")
          if p.exists():
              d=json.loads(p.read_text())
              print("- Planos textuales aprobados:",len(d["shots"]))
              print("- Verificación científica externa:",d["scientific_facts_verified"])
              for x in d["shots"]:
                  print("- Escena",x["scene"],x["scale"],x["angle"],x["role"],"|",x["visible_action"])
          else:
              print("- Plan rechazado; revisar registro para el motivo exacto")
          PY
          gh issue comment 20 --repo "$REPO" --body-file /tmp/report.md
