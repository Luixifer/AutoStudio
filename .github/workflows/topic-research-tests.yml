name: AutoStudio 0.4 · comprobación gratuita de temas
on:
  pull_request:
    paths:
      - 'scripts/topic_intake.py'
      - 'scripts/topic_research.py'
      - 'scripts/storyboard_draft.py'
      - 'tests/test_topic_intake.py'
      - 'tests/test_topic_research.py'
      - 'tests/test_storyboard_draft.py'
      - '.github/workflows/topic-research-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  topic-research-tests:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify new free-topic contracts without network or paid APIs
        run: python -m unittest tests.test_topic_intake tests.test_topic_research tests.test_storyboard_draft -v
