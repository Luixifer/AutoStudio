name: AutoStudio 0.4 · comprobación gratuita de temas
on:
  pull_request:
    paths:
      - 'scripts/topic_intake.py'
      - 'scripts/topic_research.py'
      - 'scripts/storyboard_draft.py'
      - 'scripts/research_pipeline.py'
      - 'tests/test_topic_intake.py'
      - 'tests/test_topic_research.py'
      - 'tests/test_storyboard_draft.py'
      - 'tests/test_research_pipeline.py'
      - '.github/workflows/topic-research-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  topic-research-tests:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify new free-topic contracts without network or paid APIs
        run: |
          python -m unittest discover -s tests -p 'test_topic_*.py' -v
          python -m unittest discover -s tests -p 'test_storyboard_draft.py' -v
          python -m unittest discover -s tests -p 'test_research_pipeline.py' -v
      - name: Probe public research access for a new topic (non-blocking)
        run: |
          python -m scripts.research_pipeline "¿Por qué vemos siempre la misma cara de la Luna?" --out-dir /tmp/autostudio-research
          python - <<'PY'
          import json
          from pathlib import Path
          items=list(Path("/tmp/autostudio-research").glob("*.json"))
          assert len(items)==1
          result=json.loads(items[0].read_text(encoding="utf-8"))
          assert result["safe_for_render"] is False, "Un tema sin guion aprobado no debe renderizarse"
          print("PUBLIC_RESEARCH_STATUS:",result["dossier"].get("research",{}).get("status"))
          print("PUBLIC_RESEARCH_LEADS:",len(result["dossier"].get("sources",[])))
          print("No se ha generado ninguna narración, imagen ni MP4.")
          PY
