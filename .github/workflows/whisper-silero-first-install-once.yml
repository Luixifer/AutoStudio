name: AutoStudio · instalar Whisper y Silero en CPU y comprobar voz
on:
  push:
    branches:
      - feat/offline-audio-ai-qa-20261119
permissions:
  contents: read
jobs:
  speech-model-install-and-real-inference:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Preparar herramienta de voz local
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng
      - name: Instalar las dos IA gratuitas en entorno aislado
        run: |
          python -m pip install --disable-pip-version-check -r requirements-audio-qa.txt
          python -m pip check
      - name: Comprobar regresiones sin red
        run: |
          python -m py_compile scripts/audio_ai_qa.py
          python -m unittest tests.test_audio_ai_qa -v
      - name: Generar audio español de prueba completamente local
        run: |
          mkdir -p /tmp/autostudio-audio-qa
          espeak-ng -v es -s 145 -w /tmp/autostudio-audio-qa/voz_prueba.wav "Hola. Este es un ejemplo de voz para probar el sistema."
      - name: Ejecutar Whisper tiny y Silero VAD de verdad
        run: |
          python -m scripts.audio_ai_qa \
            --audio /tmp/autostudio-audio-qa/voz_prueba.wav \
            --expected "Hola. Este es un ejemplo de voz para probar el sistema." \
            --out /tmp/autostudio-audio-qa/informe.json \
            --model tiny
          python - <<'PY'
          import json
          p=json.load(open("/tmp/autostudio-audio-qa/informe.json"))
          print("WHISPER_RECOGNIZED:",p['recognized_text'])
          print("VAD_SEGMENTS:",p['speech_segments'])
          print("ACCURACY:",p['word_match_ratio'])
          print("NEEDS_REVIEW:",p['review_needed'])
          print("YOUTUBE_ENABLED:",p['youtube_enabled'])
          assert p['engines']['speech_detection']=="Silero VAD ONNX CPU"
          assert p['duration_s']>1
          assert not p['ready_to_publish']
          PY
      - name: Guardar WAV e informe de IA para revisión
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AutoStudio-Whisper-Silero-Speech-QA
          path: |
            /tmp/autostudio-audio-qa/voz_prueba.wav
            /tmp/autostudio-audio-qa/informe.json
          retention-days: 14
          if-no-files-found: warn
